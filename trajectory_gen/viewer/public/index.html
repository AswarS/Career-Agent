<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Trace Inspector</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Plan Trace Inspector</strong><span id="run-state" class="muted">加载中</span></div>
    <div class="toolbar">
      <label for="run-select">轨迹</label><select id="run-select"></select>
      <button id="timezone" type="button" title="切换 UTC 和本地时间">UTC</button>
      <button id="reasoning" type="button" title="显示或隐藏规划推理">显示推理</button>
    </div>
  </header>
  <main class="layout">
    <aside class="source-panel panel">
      <h2>合成任务</h2>
      <dl id="source-meta"></dl>
      <h3>任务原文</h3><div id="task-text" class="prose"></div>
      <h3>画像</h3><pre id="persona"></pre>
      <h3>输入材料</h3><div id="materials"></div>
      <h3>生成产物</h3><div id="artifacts"></div>
    </aside>
    <section class="trace-panel panel">
      <div class="section-head"><div><h1 id="title">轨迹</h1><p id="subtitle" class="muted"></p></div><div id="badges" class="badges"></div></div>
      <div id="filters" class="filters">
        <button class="active" data-kind="all">全部</button><button data-kind="plan">Tool 选择</button><button data-kind="observation">Tool 输出</button><button data-kind="context">上下文</button>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>
    <aside class="detail-panel panel">
      <h2>上下文 Token</h2><div id="tokens"></div>
      <h2>自动审计</h2><div id="audit"></div>
      <h2>Tool Inventory</h2><div id="tool-inventory"></div>
      <h2>选中步骤</h2><div id="detail-empty" class="empty">选择中间的任一步骤</div><div id="detail" hidden><h3 id="detail-title"></h3><pre id="detail-content"></pre></div>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
