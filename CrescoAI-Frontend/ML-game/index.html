<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器学习冒险 - ML Quest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90vw;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header h1 { font-size: 24px; }
        #stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid #e9ecef;
        }
        .level-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .level-item:hover { transform: translateX(5px); border-color: #667eea; }
        .level-item.locked { opacity: 0.5; cursor: not-allowed; }
        .level-item.completed { background: #d4edda; border-color: #28a745; }
        .level-item.active { border-color: #667eea; background: #e7f3ff; }
        #content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        #canvas-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        canvas {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background: white;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .theory-section, .demo-section, .challenge-section {
            background: #f8f9fa;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .achievement {
            display: inline-block;
            background: #ffc107;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            margin: 5px;
            font-size: 14px;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        #start-screen {
            text-align: center;
            padding: 50px;
        }
        #start-screen h2 { font-size: 36px; margin-bottom: 20px; color: #667eea; }
        #start-screen p { font-size: 18px; margin-bottom: 30px; color: #666; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="header">
        <h1>ML Quest - 机器学习冒险</h1>
        <div id="stats">
            <div class="stat-item">⭐ 等级: <span id="level-display">1</span></div>
            <div class="stat-item">💎 经验: <span id="xp-display">0</span></div>
            <div class="stat-item">🏆 徽章: <span id="badge-display">0</span></div>
        </div>
    </div>
    <div id="main-content">
        <div id="sidebar">
            <h3 style="margin-bottom:15px;">学习路径</h3>
            <div id="level-list"></div>
        </div>
        <div id="content-area">
            <div id="start-screen" class="screen active">
                <h2>欢迎来到 ML Quest!</h2>
                <p>通过互动游戏掌握机器学习</p>
                <button class="btn btn-primary" id="start-btn" onclick="startGame()">开始冒险</button>
            </div>
            <div id="lesson-screen" class="screen">
                <h2 id="lesson-title"></h2>
                <div id="lesson-content"></div>
                <div id="canvas-container">
                    <canvas id="viz-canvas" width="600" height="400"></canvas>
                </div>
                <div id="lesson-controls">
                    <button class="btn btn-primary" onclick="showDemo()">互动演示</button>
                    <button class="btn btn-success" onclick="showChallenge()">实践挑战</button>
                </div>
            </div>
            <div id="achievement-screen" class="screen">
                <h2>成就系统</h2>
                <div id="achievement-list"></div>
            </div>
        </div>
    </div>
</div>
<script>
// Game State
const gameState = {
    currentLevel: 0,
    xp: 0,
    level: 1,
    badges: [],
    completedLevels: [],
    mode: 'start'
};

// Learning Modules
const levels = [
    {
        id: 0,
        title: '1. 机器学习基础',
        theory: '机器学习是让计算机从数据中学习的技术。主要分为监督学习、无监督学习和强化学习三大类。',
        demo: 'linear-regression',
        xpReward: 100
    },
    {
        id: 1,
        title: '2. 线性回归',
        theory: '线性回归是最基础的监督学习算法，用于预测连续值。它试图找到一条最佳拟合直线。',
        demo: 'linear-regression-interactive',
        xpReward: 150
    },
    {
        id: 2,
        title: '3. K-means聚类',
        theory: 'K-means是无监督学习算法，将数据分成K个簇。每个点属于距离最近的簇中心。',
        demo: 'kmeans',
        xpReward: 200
    },
    {
        id: 3,
        title: '4. 决策树',
        theory: '决策树通过一系列问题将数据分类。每个节点代表一个特征判断，叶子节点是最终分类。',
        demo: 'decision-tree',
        xpReward: 200
    },
    {
        id: 4,
        title: '5. 神经网络入门',
        theory: '神经网络模拟大脑神经元，由输入层、隐藏层和输出层组成。通过反向传播学习。',
        demo: 'neural-network',
        xpReward: 300
    }
];

// Initialize
function init() {
    loadProgress();
    renderLevelList();
    updateStats();
}

function loadProgress() {
    try {
        const saved = localStorage.getItem('mlquest-progress');
        if (saved) {
            const data = JSON.parse(saved);
            Object.assign(gameState, data);
        }
    } catch {
        // The demo can run inside a sandboxed iframe where storage is unavailable.
    }
}

function saveProgress() {
    try {
        localStorage.setItem('mlquest-progress', JSON.stringify(gameState));
    } catch {
        // Progress persistence is optional for the local demo.
    }
}

function renderLevelList() {
    const list = document.getElementById('level-list');
    list.innerHTML = '';
    levels.forEach((level, idx) => {
        const div = document.createElement('div');
        div.className = 'level-item';
        if (gameState.completedLevels.includes(idx)) div.classList.add('completed');
        if (gameState.currentLevel === idx) div.classList.add('active');
        if (idx > 0 && !gameState.completedLevels.includes(idx - 1)) div.classList.add('locked');
        div.innerHTML = `<strong>${level.title}</strong><br><small>${level.xpReward} XP</small>`;
        div.onclick = () => {
            if (!div.classList.contains('locked')) loadLevel(idx);
        };
        list.appendChild(div);
    });
}

function updateStats() {
    document.getElementById('level-display').textContent = gameState.level;
    document.getElementById('xp-display').textContent = gameState.xp;
    document.getElementById('badge-display').textContent = gameState.badges.length;
}

function startGame() {
    gameState.mode = 'lesson';
    showScreen('lesson-screen');
    loadLevel(0);
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function loadLevel(idx) {
    gameState.currentLevel = idx;
    const level = levels[idx];
    document.getElementById('lesson-title').textContent = level.title;
    document.getElementById('lesson-content').innerHTML = `
        <div class="theory-section">
            <h3>📚 理论知识</h3>
            <p>${level.theory}</p>
        </div>
    `;
    renderLevelList();
    showDemo();
}

function showDemo() {
    const level = levels[gameState.currentLevel];
    const canvas = document.getElementById('viz-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (level.demo === 'linear-regression' || level.demo === 'linear-regression-interactive') {
        drawLinearRegression(ctx);
    } else if (level.demo === 'kmeans') {
        drawKMeans(ctx);
    } else if (level.demo === 'decision-tree') {
        drawDecisionTree(ctx);
    } else if (level.demo === 'neural-network') {
        drawNeuralNetwork(ctx);
    }
}

function showChallenge() {
    const level = levels[gameState.currentLevel];
    if (!gameState.completedLevels.includes(gameState.currentLevel)) {
        gameState.completedLevels.push(gameState.currentLevel);
        gameState.xp += level.xpReward;
        if (gameState.xp >= gameState.level * 500) {
            gameState.level++;
            gameState.badges.push(`Level ${gameState.level}`);
        }
        saveProgress();
        updateStats();
        renderLevelList();
        alert(`🎉 完成! 获得 ${level.xpReward} XP`);
    }
}

// Visualization Functions
function drawLinearRegression(ctx) {
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(0, 0, 600, 400);

    // Draw axes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(50, 350);
    ctx.lineTo(550, 350);
    ctx.moveTo(50, 350);
    ctx.lineTo(50, 50);
    ctx.stroke();

    // Generate sample data points
    const points = [];
    for (let i = 0; i < 20; i++) {
        const x = 50 + i * 25;
        const y = 300 - i * 10 + (Math.random() - 0.5) * 40;
        points.push({x, y});
    }

    // Draw points
    ctx.fillStyle = '#667eea';
    points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw regression line
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(50, 300);
    ctx.lineTo(550, 100);
    ctx.stroke();

    ctx.fillStyle = '#333';
    ctx.font = '14px Arial';
    ctx.fillText('线性回归拟合', 250, 30);
}

function drawKMeans(ctx) {
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(0, 0, 600, 400);

    const clusters = [
        {cx: 150, cy: 150, color: '#e74c3c'},
        {cx: 350, cy: 200, color: '#3498db'},
        {cx: 450, cy: 100, color: '#2ecc71'}
    ];

    // Generate points around clusters
    clusters.forEach(cluster => {
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 50;
            const x = cluster.cx + Math.cos(angle) * dist;
            const y = cluster.cy + Math.sin(angle) * dist;

            ctx.fillStyle = cluster.color;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw cluster center
        ctx.globalAlpha = 1;
        ctx.fillStyle = cluster.color;
        ctx.beginPath();
        ctx.arc(cluster.cx, cluster.cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    });

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#333';
    ctx.font = '14px Arial';
    ctx.fillText('K-means 聚类 (K=3)', 230, 30);
}

function drawDecisionTree(ctx) {
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(0, 0, 600, 400);

    function drawNode(x, y, text, isLeaf) {
        ctx.fillStyle = isLeaf ? '#2ecc71' : '#667eea';
        ctx.beginPath();
        if (isLeaf) {
            ctx.fillRect(x - 30, y - 15, 60, 30);
        } else {
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#fff';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(text, x, y + 4);
    }

    function drawEdge(x1, y1, x2, y2, label) {
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.fillStyle = '#666';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(label, (x1+x2)/2 - 10, (y1+y2)/2);
    }

    drawEdge(300, 70, 180, 160, '是');
    drawEdge(300, 70, 420, 160, '否');
    drawEdge(180, 160, 120, 260, '是');
    drawEdge(180, 160, 240, 260, '否');
    drawEdge(420, 160, 360, 260, '是');
    drawEdge(420, 160, 480, 260, '否');

    drawNode(300, 70, '特征A>5?', false);
    drawNode(180, 160, '特征B>3?', false);
    drawNode(420, 160, '特征C>7?', false);
    drawNode(120, 260, '类别A', true);
    drawNode(240, 260, '类别B', true);
    drawNode(360, 260, '类别A', true);
    drawNode(480, 260, '类别B', true);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#333';
    ctx.font = '14px Arial';
    ctx.fillText('决策树分类', 250, 350);
}

function drawNeuralNetwork(ctx) {
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(0, 0, 600, 400);

    const layers = [
        {x: 100, nodes: 3, label: '输入层'},
        {x: 250, nodes: 4, label: '隐藏层1'},
        {x: 400, nodes: 4, label: '隐藏层2'},
        {x: 550, nodes: 2, label: '输出层'}
    ];

    // Draw connections
    for (let l = 0; l < layers.length - 1; l++) {
        for (let i = 0; i < layers[l].nodes; i++) {
            for (let j = 0; j < layers[l+1].nodes; j++) {
                const y1 = 80 + i * (280 / layers[l].nodes);
                const y2 = 80 + j * (280 / layers[l+1].nodes);
                ctx.strokeStyle = `rgba(102, 126, 234, ${Math.random() * 0.5 + 0.1})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(layers[l].x, y1);
                ctx.lineTo(layers[l+1].x, y2);
                ctx.stroke();
            }
        }
    }

    // Draw nodes
    layers.forEach(layer => {
        for (let i = 0; i < layer.nodes; i++) {
            const y = 80 + i * (280 / layer.nodes);
            ctx.fillStyle = '#667eea';
            ctx.beginPath();
            ctx.arc(layer.x, y, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        ctx.fillStyle = '#333';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(layer.label, layer.x, 380);
    });

    ctx.textAlign = 'left';
    ctx.fillStyle = '#333';
    ctx.font = '14px Arial';
    ctx.fillText('神经网络结构', 250, 30);
}

// Canvas interaction
const canvas = document.getElementById('viz-canvas');
canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const level = levels[gameState.currentLevel];
    if (level.demo === 'linear-regression-interactive') {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
    }
});

// render_game_to_text for testing
window.render_game_to_text = function() {
    return JSON.stringify({
        mode: gameState.mode,
        currentLevel: gameState.currentLevel,
        xp: gameState.xp,
        level: gameState.level,
        badges: gameState.badges,
        completedLevels: gameState.completedLevels
    });
};

window.advanceTime = function(ms) {};

init();
</script>
</body>
</html>
